<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <title>Spaceship (FocusPod v2) pod coordinate system - PROPOSED</title>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="axr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker>
    <marker id="axg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2ca02c"/></marker>
    <marker id="axb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker>
    <marker id="axk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="800" fill="#ffffff"/>

  <!-- ============ FRONT VIEW (X right, Z up). scale 0.14 px/mm, O at (245,420) ============ -->
  <text x="70" y="50" font-size="12" font-weight="bold">FRONT VIEW (from outside, facing the door, looking toward +Y)</text>
  <text x="70" y="66" fill="#555">2D: X(view) = +X, Y(view) = +Z</text>
  <line x1="40" y1="420" x2="450" y2="420" stroke="#999" stroke-width="1"/>
  <text x="372" y="434" fill="#777">room floor, Z = 0</text>
  <rect x="70" y="84" width="350" height="336" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="70" y="403.6" width="350" height="16.4" fill="#d9d9d9" stroke="#222" stroke-width="0.8"/>
  <text x="76" y="415" font-size="9" fill="#333">base band (trim)</text>
  <!-- decor zones (schematic boxes; faceted skins not drawn) -->
  <rect x="70" y="84" width="38.9" height="319.6" fill="#f2f2f2" stroke="#555" stroke-dasharray="4 3"/>
  <rect x="108.9" y="84" width="168.3" height="36.8" fill="#f2f2f2" stroke="#555" stroke-dasharray="4 3"/>
  <rect x="277.2" y="84" width="142.8" height="319.6" fill="#f2f2f2" stroke="#555" stroke-dasharray="4 3" fill-opacity="0.6"/>
  <text x="80" y="250" font-weight="bold">DL</text>
  <text x="182" y="106" font-weight="bold">DT</text>
  <text x="392" y="250" font-weight="bold">DR</text>
  <!-- glass outlines from the v1 STEP (Z + 15 to the room-floor datum) -->
  <polygon points="110.4,402.9 275.0,402.9 235.4,121.4 110.4,121.4" fill="#9ecae1" fill-opacity="0.55" stroke="#08519c" stroke-width="1"/>
  <polygon points="275.5,403.3 377.8,403.3 349.9,204.7 277.1,120.9 235.8,120.9" fill="#c6dbef" fill-opacity="0.55" stroke="#08519c" stroke-width="1"/>
  <text x="140" y="300" fill="#08306b">DOOR</text>
  <text x="128" y="313" font-size="9" fill="#08306b">hinges on the LEFT</text>
  <text x="288" y="330" fill="#08306b">FIXED</text>
  <text x="288" y="343" fill="#08306b">GLASS</text>
  <rect x="109" y="355.9" width="9" height="12.6" fill="#444"/>
  <rect x="109" y="159.9" width="9" height="12.6" fill="#444"/>
  <line x1="241" y1="242.4" x2="241" y2="284.4" stroke="#444" stroke-width="3"/>
  <text x="70" y="452" font-weight="bold">LEFT (-X)</text>
  <text x="352" y="452" font-weight="bold">RIGHT (+X)</text>
  <!-- axes at O -->
  <line x1="245" y1="420" x2="300" y2="420" stroke="#d62728" stroke-width="2" marker-end="url(#axr)"/>
  <text x="304" y="416" fill="#d62728" font-weight="bold">+X</text>
  <line x1="245" y1="420" x2="245" y2="365" stroke="#1f77b4" stroke-width="2" marker-end="url(#axb)"/>
  <text x="250" y="372" fill="#1f77b4" font-weight="bold">+Z</text>
  <circle cx="245" cy="420" r="6" fill="#fff" stroke="#2ca02c" stroke-width="1.5"/>
  <line x1="241" y1="416" x2="249" y2="424" stroke="#2ca02c" stroke-width="1.5"/>
  <line x1="249" y1="416" x2="241" y2="424" stroke="#2ca02c" stroke-width="1.5"/>
  <text x="196" y="438" fill="#2ca02c">+Y into page (back)</text>
  <text x="226" y="414" font-weight="bold">O</text>
  <text x="300" y="80" font-size="9" fill="#555">top Z = 2400 (plan)</text>

  <!-- ============ LEFT VIEW (first angle: placed to the right of the front view) ============ -->
  <text x="480" y="50" font-size="12" font-weight="bold">LEFT VIEW (from the -X side)</text>
  <text x="480" y="66" fill="#555">2D: X(view) = -Y, Y(view) = +Z</text>
  <line x1="465" y1="420" x2="760" y2="420" stroke="#999" stroke-width="1"/>
  <rect x="480" y="84" width="238" height="336" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="480" y="403.6" width="238" height="16.4" fill="#d9d9d9" stroke="#222" stroke-width="0.8"/>
  <rect x="690" y="84" width="28" height="319.6" fill="#f2f2f2" stroke="#555" stroke-dasharray="4 3"/>
  <text x="692" y="250" font-size="9" transform="rotate(-90 700 250)">decor 200</text>
  <line x1="480" y1="244" x2="690" y2="244" stroke="#555" stroke-dasharray="6 3"/>
  <text x="560" y="330" font-weight="bold">L1</text>
  <text x="560" y="170" font-weight="bold">L2</text>
  <text x="488" y="236" font-size="9" fill="#555">frame split (plan; final from layout study)</text>
  <line x1="690" y1="84" x2="690" y2="420" stroke="#222" stroke-width="0.8"/>
  <text x="640" y="436" font-size="9" fill="#555">Y = -650</text>
  <!-- axes -->
  <line x1="599" y1="420" x2="544" y2="420" stroke="#2ca02c" stroke-width="2" marker-end="url(#axg)"/>
  <text x="520" y="414" fill="#2ca02c" font-weight="bold">+Y</text>
  <line x1="599" y1="420" x2="599" y2="365" stroke="#1f77b4" stroke-width="2" marker-end="url(#axb)"/>
  <text x="604" y="372" fill="#1f77b4" font-weight="bold">+Z</text>
  <circle cx="599" cy="420" r="6" fill="#fff" stroke="#d62728" stroke-width="1.5"/>
  <line x1="595" y1="416" x2="603" y2="424" stroke="#d62728" stroke-width="1.5"/>
  <line x1="603" y1="416" x2="595" y2="424" stroke="#d62728" stroke-width="1.5"/>
  <text x="566" y="452" fill="#d62728">+X into page</text>
  <text x="480" y="452" font-weight="bold">BACK (+Y)</text>
  <text x="672" y="452" font-weight="bold">FRONT (-Y)</text>

  <!-- ============ TOP VIEW (first angle: placed below the front view), O at (245,609) ============ -->
  <text x="70" y="478" font-size="12" font-weight="bold">TOP VIEW (from above; front at the bottom)</text>
  <text x="330" y="478" fill="#555">2D: X(view) = +X, Y(view) = +Y</text>
  <rect x="70" y="490" width="350" height="238" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="70" y="490" width="350" height="5.3" fill="#bdbdbd"/>
  <rect x="70" y="490" width="5.3" height="210" fill="#bdbdbd"/>
  <rect x="414.7" y="490" width="5.3" height="210" fill="#bdbdbd"/>
  <line x1="70" y1="700" x2="420" y2="700" stroke="#222" stroke-width="0.8"/>
  <rect x="70" y="700" width="350" height="28" fill="#f2f2f2" stroke="#555" stroke-dasharray="4 3"/>
  <text x="300" y="718" font-size="9" fill="#333">decor zone, Y = -650 to -850</text>
  <line x1="108.9" y1="707.6" x2="378" y2="707.6" stroke="#08519c" stroke-width="1.2" stroke-dasharray="5 2"/>
  <text x="112" y="722" font-size="9" fill="#08306b">door + fixed glass line</text>
  <line x1="245" y1="495.3" x2="245" y2="700" stroke="#555" stroke-dasharray="6 3"/>
  <text x="150" y="560" font-weight="bold">C1</text>
  <text x="330" y="560" font-weight="bold">C2</text>
  <text x="120" y="575" font-size="9" fill="#555">ceiling halves (plan)</text>
  <text x="82" y="510" font-size="9" fill="#555">back wall B1..B4</text>
  <text x="78" y="650" font-size="9" fill="#555" transform="rotate(-90 82 650)">left wall L1/L2</text>
  <text x="404" y="650" font-size="9" fill="#555" transform="rotate(-90 410 650)">right wall R1/R2</text>
  <text x="48" y="488" font-weight="bold">BL</text>
  <text x="424" y="488" font-weight="bold">BR</text>
  <text x="48" y="742" font-weight="bold">FL</text>
  <text x="424" y="742" font-weight="bold">FR</text>
  <!-- axes -->
  <line x1="245" y1="609" x2="300" y2="609" stroke="#d62728" stroke-width="2" marker-end="url(#axr)"/>
  <text x="304" y="605" fill="#d62728" font-weight="bold">+X</text>
  <line x1="245" y1="609" x2="245" y2="554" stroke="#2ca02c" stroke-width="2" marker-end="url(#axg)"/>
  <text x="250" y="561" fill="#2ca02c" font-weight="bold">+Y</text>
  <circle cx="245" cy="609" r="6" fill="#fff" stroke="#1f77b4" stroke-width="1.5"/>
  <circle cx="245" cy="609" r="1.8" fill="#1f77b4"/>
  <text x="226" y="627" fill="#1f77b4">+Z out of page</text>
  <text x="228" y="604" font-weight="bold">O</text>
  <!-- viewer -->
  <line x1="245" y1="790" x2="245" y2="748" stroke="#333" stroke-width="1.5" marker-end="url(#axk)"/>
  <text x="255" y="772" fill="#333">viewer OUTSIDE, facing the door:</text>
  <text x="255" y="786" fill="#333">left = -X, right = +X, front = -Y</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(470,500)">
    <rect x="0" y="0" width="315" height="232" fill="#fafafa" stroke="#ccc"/>
    <text x="10" y="20" font-weight="bold" font-size="12">Pod coordinate system (PROPOSED)</text>
    <text x="10" y="40">O on the room floor (Z = 0), at the centre of</text>
    <text x="10" y="54">the 2500 width (X = 0) and the 1700 depth (Y = 0).</text>
    <text x="10" y="74"><tspan fill="#d62728" font-weight="bold">+X</tspan> to the right wall</text>
    <text x="10" y="88"><tspan fill="#2ca02c" font-weight="bold">+Y</tspan> to the back wall (away from the door)</text>
    <text x="10" y="102"><tspan fill="#1f77b4" font-weight="bold">+Z</tspan> up. Right-handed: X x Y = Z.</text>
    <text x="10" y="122">Left/right/front/back are always named as seen</text>
    <text x="10" y="136">from OUTSIDE, facing the door, never from inside.</text>
    <text x="10" y="156">v1 STEP: X and Y match; Z(v2) = Z(v1) + 15.</text>
    <text x="10" y="176">First-angle (ISO 5456-2): top view below the</text>
    <text x="10" y="190">front view, left view to its right.</text>
    <text x="10" y="210" fill="#555" font-size="10">Glass outlines and decor boxes: v1 STEP, schematic.</text>
    <text x="10" y="224" fill="#555" font-size="10">Scale about 1:71 at 100 %. mm.</text>
  </g>
</svg>
